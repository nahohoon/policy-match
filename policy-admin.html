<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>정책자금 CRM 관리 | 나호훈 경영컨설팅</title>
  <style>
    :root {
      --navy: #0F2448;
      --navy-light: #1a3a6e;
      --navy-dark: #091830;
      --gold: #c9a84c;
      --gold-light: #e5c878;
      --gold-pale: #fdf6e3;
      --white: #ffffff;
      --gray-50: #f8fafc;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-300: #cbd5e1;
      --gray-400: #94a3b8;
      --gray-500: #64748b;
      --gray-600: #475569;
      --gray-700: #334155;
      --gray-800: #1e293b;
      --green: #16a34a;
      --green-light: #dcfce7;
      --yellow: #d97706;
      --yellow-light: #fef3c7;
      --red: #dc2626;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(15,36,72,0.10);
      --shadow-lg: 0 8px 40px rgba(15,36,72,0.18);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      background: var(--gray-50);
      color: var(--gray-800);
      min-height: 100vh;
    }
    header {
      background: var(--navy);
      padding: 14px 16px;
      position: sticky; top: 0; z-index: 50;
      box-shadow: 0 2px 16px rgba(0,0,0,0.2);
    }
    .header-inner {
      max-width: 1100px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .header-title { color: var(--white); font-size: 17px; font-weight: 800; }
    .header-sub { color: var(--gold-light); font-size: 12px; font-weight: 400; margin-top: 2px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 700;
      border: none; cursor: pointer; font-family: inherit; transition: all 0.2s;
    }
    .btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: var(--navy); }
    .btn-outline { background: transparent; color: var(--white); border: 1.5px solid rgba(255,255,255,0.35); }
    .btn-primary { background: var(--navy-light); color: var(--white); }
    .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 6px; }
    main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }
    .settings-bar {
      background: var(--navy-dark); border-radius: var(--radius);
      padding: 14px 16px; margin-bottom: 16px; border: 1px solid rgba(201,168,76,0.2);
    }
    .settings-bar label { color: var(--gold-light); font-size: 12px; font-weight: 600; display: block; margin-bottom: 6px; }
    .settings-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .settings-row input {
      flex: 1; min-width: 200px; padding: 8px 12px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.08);
      color: var(--white); font-size: 13px; font-family: monospace;
    }
    .kpi-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 10px; margin-bottom: 16px;
    }
    @media (min-width: 640px) { .kpi-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 960px) { .kpi-grid { grid-template-columns: repeat(4, 1fr); } }
    .kpi-card {
      background: var(--white); border-radius: var(--radius); padding: 14px 16px;
      box-shadow: var(--shadow); border: 1px solid var(--gray-100);
      position: relative; overflow: hidden;
    }
    .kpi-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--navy), var(--gold));
    }
    .kpi-card.kpi-highlight::before { background: linear-gradient(90deg, var(--gold), var(--gold-light)); }
    .kpi-card.kpi-success::before { background: linear-gradient(90deg, #16a34a, #4ade80); }
    .kpi-num {
      font-size: 26px; font-weight: 800; color: var(--navy); line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .kpi-num.accent { color: var(--gold); }
    .kpi-num.success { color: #15803d; }
    .kpi-label { font-size: 11px; color: var(--gray-500); margin-top: 6px; font-weight: 600; }
    .kpi-sub { font-size: 10px; color: var(--gray-400); margin-top: 2px; }
    .filter-bar {
      background: var(--white); border-radius: var(--radius); padding: 14px 16px;
      box-shadow: var(--shadow); margin-bottom: 16px;
    }
    .filter-row {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    }
    .filter-row + .filter-row { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--gray-100); }
    .filter-label { font-size: 12px; font-weight: 700; color: var(--gray-600); min-width: 52px; }
    .status-pills { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
    .pill {
      padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
      border: 1.5px solid var(--gray-200); background: var(--white); color: var(--gray-600);
      cursor: pointer; transition: all 0.15s;
    }
    .pill.active { color: var(--white); border-color: transparent; box-shadow: 0 2px 8px rgba(15,36,72,0.15); }
    .pill[data-status="전체"].active { background: var(--navy); border-color: var(--navy); }
    .pill[data-status="신규"] { border-color: #94a3b8; color: #64748b; }
    .pill[data-status="신규"].active { background: #64748b; }
    .pill[data-status="연락시도"] { border-color: #f59e0b; color: #b45309; }
    .pill[data-status="연락시도"].active { background: #d97706; }
    .pill[data-status="상담중"] { border-color: #3b82f6; color: #1d4ed8; }
    .pill[data-status="상담중"].active { background: #2563eb; }
    .pill[data-status="상담완료"] { border-color: #14b8a6; color: #0d9488; }
    .pill[data-status="상담완료"].active { background: #0d9488; }
    .pill[data-status="계약"] { border-color: #22c55e; color: #15803d; }
    .pill[data-status="계약"].active { background: #16a34a; }
    .pill[data-status="보류"] { border-color: #f97316; color: #c2410c; }
    .pill[data-status="보류"].active { background: #ea580c; }
    .pill[data-status="부적합"] { border-color: #ef4444; color: #dc2626; }
    .pill[data-status="부적합"].active { background: #dc2626; }
    .filter-input, .filter-select {
      padding: 8px 12px; border: 1.5px solid var(--gray-200); border-radius: 8px;
      font-size: 13px; font-family: inherit; color: var(--gray-800); background: var(--white);
      min-width: 0;
    }
    .filter-input { flex: 1; min-width: 140px; }
    .filter-select { min-width: 120px; }
    .filter-select:disabled { opacity: 0.55; cursor: not-allowed; background: var(--gray-50); }
    .list-meta { font-size: 13px; color: var(--gray-500); margin-bottom: 12px; }
    #consult-list { display: flex; flex-direction: column; gap: 14px; }
    @media (max-width: 480px) { #consult-list { gap: 12px; } }
    .consult-card {
      background: var(--white); border-radius: 14px; box-shadow: var(--shadow);
      padding: 18px 18px 16px; border-left: 4px solid var(--gray-300);
      cursor: pointer; transition: box-shadow 0.22s, transform 0.18s, border-color 0.2s;
      position: relative;
    }
    .consult-card:hover {
      box-shadow: var(--shadow-lg); transform: translateY(-2px);
      border-left-width: 5px;
    }
    .consult-card[data-status="신규"] { border-left-color: #94a3b8; }
    .consult-card[data-status="연락시도"] { border-left-color: #f59e0b; }
    .consult-card[data-status="상담중"] { border-left-color: #3b82f6; }
    .consult-card[data-status="상담완료"] { border-left-color: #14b8a6; }
    .consult-card[data-status="계약"] { border-left-color: #22c55e; }
    .consult-card[data-status="보류"] { border-left-color: #f97316; }
    .consult-card[data-status="부적합"] { border-left-color: #ef4444; }
    .card-progress-wrap {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    }
    .card-progress-track {
      flex: 1; height: 4px; background: var(--gray-100); border-radius: 99px; overflow: hidden;
    }
    .card-progress-fill {
      height: 100%; border-radius: 99px; transition: width 0.45s ease;
      background: linear-gradient(90deg, var(--navy-light), var(--gold));
    }
    .card-progress-pct { font-size: 11px; font-weight: 700; color: var(--gray-500); min-width: 34px; text-align: right; }
    .card-top {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 12px; margin-bottom: 10px; padding-right: 4px;
    }
    .card-title-block { flex: 1; min-width: 0; padding-right: 72px; }
    .card-company {
      font-size: 17px; font-weight: 800; color: var(--navy);
      line-height: 1.35; word-break: keep-all;
    }
    .card-receipt { font-size: 11px; color: var(--gray-400); margin-top: 4px; font-family: monospace; }
    .status-badge {
      position: absolute; top: 16px; right: 16px;
      padding: 5px 11px; border-radius: 20px; font-size: 11px; font-weight: 700;
      white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .status-badge[data-status="신규"] { background: #f1f5f9; color: #64748b; }
    .status-badge[data-status="연락시도"] { background: #fef3c7; color: #b45309; }
    .status-badge[data-status="상담중"] { background: #dbeafe; color: #1d4ed8; }
    .status-badge[data-status="상담완료"] { background: #ccfbf1; color: #0d9488; }
    .status-badge[data-status="계약"] { background: #dcfce7; color: #15803d; }
    .status-badge[data-status="보류"] { background: #ffedd5; color: #c2410c; }
    .status-badge[data-status="부적합"] { background: #fee2e2; color: #dc2626; }
    .card-info-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin-bottom: 10px;
    }
    @media (max-width: 400px) { .card-info-grid { grid-template-columns: 1fr; } }
    .card-info-item {
      display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--gray-600);
    }
    .card-info-icon { font-size: 13px; opacity: 0.85; flex-shrink: 0; }
    .card-info-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-policy {
      font-size: 12px; color: var(--gray-600); margin-bottom: 12px; padding: 8px 10px;
      background: var(--gray-50); border-radius: 8px; line-height: 1.5;
    }
    .card-actions {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; padding-top: 14px;
      border-top: 1px solid var(--gray-100);
    }
    .card-actions select {
      font-size: 12px; padding: 8px 10px; border-radius: 8px;
      border: 1.5px solid var(--gray-200); font-family: inherit; min-width: 110px;
    }
    .card-actions textarea, .card-actions input[type="text"] {
      font-size: 12px; padding: 8px 10px; border-radius: 8px;
      border: 1.5px solid var(--gray-200); font-family: inherit;
    }
    .card-actions textarea { flex: 1; min-width: 100%; min-height: 56px; resize: vertical; }
    .btn-save-card {
      background: linear-gradient(135deg, var(--gold), var(--gold-light)) !important;
      color: var(--navy) !important; font-weight: 800 !important;
      box-shadow: 0 2px 10px rgba(201,168,76,0.35);
      padding: 8px 18px !important;
    }
    .btn-save-card:hover { filter: brightness(1.05); transform: translateY(-1px); }
    .empty-state {
      text-align: center; padding: 48px 20px; background: var(--white);
      border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .empty-state h3 { color: var(--navy); margin-bottom: 8px; }
    .empty-state p { color: var(--gray-500); font-size: 14px; }
    #loading-overlay {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(9,24,48,0.75); align-items: center; justify-content: center;
    }
    #loading-overlay.show { display: flex; }
    .spinner {
      width: 44px; height: 44px; border: 3px solid rgba(255,255,255,0.2);
      border-top-color: var(--gold); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--navy); color: var(--white); padding: 10px 20px;
      border-radius: 99px; font-size: 13px; font-weight: 600; z-index: 300;
      opacity: 0; transition: opacity 0.3s; pointer-events: none; max-width: 90vw; text-align: center;
    }
    #toast.show { opacity: 1; }
    /* 상세 모달 */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 150;
      background: rgba(9,24,48,0.65); backdrop-filter: blur(3px);
      padding: 16px; align-items: flex-end; justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    @media (min-width: 640px) {
      .modal-overlay { align-items: center; padding: 24px; }
    }
    .detail-modal {
      background: var(--white); border-radius: 16px 16px 0 0;
      width: 100%; max-width: 560px; max-height: min(92vh, 720px);
      display: flex; flex-direction: column; box-shadow: var(--shadow-lg);
      animation: slideUp 0.25s ease;
    }
    @media (min-width: 640px) {
      .detail-modal { border-radius: 16px; max-height: min(88vh, 720px); }
    }
    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-header {
      padding: 18px 20px 14px; border-bottom: 1px solid var(--gray-100);
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      flex-shrink: 0;
    }
    .modal-header h2 { font-size: 18px; font-weight: 800; color: var(--navy); line-height: 1.35; }
    .modal-header .sub { font-size: 12px; color: var(--gray-500); margin-top: 4px; }
    .modal-status-banner {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700;
      margin-top: 10px;
    }
    .modal-status-banner[data-status="신규"] { background: #f1f5f9; color: #64748b; }
    .modal-status-banner[data-status="연락시도"] { background: #fef3c7; color: #b45309; }
    .modal-status-banner[data-status="상담중"] { background: #dbeafe; color: #1d4ed8; }
    .modal-status-banner[data-status="상담완료"] { background: #ccfbf1; color: #0d9488; }
    .modal-status-banner[data-status="계약"] { background: #dcfce7; color: #15803d; }
    .modal-status-banner[data-status="보류"] { background: #ffedd5; color: #c2410c; }
    .modal-status-banner[data-status="부적합"] { background: #fee2e2; color: #dc2626; }
    .modal-section { margin-bottom: 20px; }
    .modal-section-title {
      font-size: 12px; font-weight: 800; color: var(--navy);
      text-transform: uppercase; letter-spacing: 0.04em;
      padding: 8px 12px; background: linear-gradient(90deg, rgba(15,36,72,0.06), transparent);
      border-left: 3px solid var(--gold); border-radius: 0 6px 6px 0;
      margin-bottom: 12px;
    }
    .modal-section-future { opacity: 0.92; }
    .field-hint { font-size: 11px; color: var(--gray-400); margin-top: 8px; }
    .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 400px) { .form-row-2 { grid-template-columns: 1fr; } }
    .form-group select:focus, .form-group textarea:focus, .form-group input:focus {
      outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(15,36,72,0.08);
    }
    .form-group textarea.modal-textarea {
      min-height: 88px; line-height: 1.55; background: var(--gray-50);
    }
    .form-group input:disabled, .form-group select:disabled {
      background: var(--gray-100); color: var(--gray-500); cursor: not-allowed;
    }
    .modal-close {
      width: 36px; height: 36px; border-radius: 50%; border: none;
      background: var(--gray-100); color: var(--gray-600); font-size: 20px;
      cursor: pointer; flex-shrink: 0; line-height: 1;
    }
    .modal-body {
      padding: 16px 20px; overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch;
    }
    .detail-grid {
      display: grid; grid-template-columns: 1fr; gap: 10px;
    }
    @media (min-width: 480px) {
      .detail-grid { grid-template-columns: 1fr 1fr; }
    }
    .detail-item {
      background: var(--gray-50); border-radius: 8px; padding: 10px 12px;
    }
    .detail-item.full { grid-column: 1 / -1; }
    .detail-label { font-size: 11px; font-weight: 700; color: var(--gray-400); margin-bottom: 4px; }
    .detail-value { font-size: 13px; font-weight: 600; color: var(--gray-800); line-height: 1.5; word-break: break-word; }
    .modal-edit {
      margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--gray-100);
    }
    .modal-edit h3 { font-size: 14px; font-weight: 800; color: var(--navy); margin-bottom: 12px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--gray-700); margin-bottom: 6px; }
    .form-group select, .form-group textarea, .form-group input[type="text"] {
      width: 100%; padding: 10px 12px; border: 1.5px solid var(--gray-200);
      border-radius: 8px; font-size: 14px; font-family: inherit;
    }
    .form-group textarea { min-height: 72px; resize: vertical; }
    .modal-footer {
      padding: 14px 20px 20px; border-top: 1px solid var(--gray-100);
      display: flex; gap: 10px; flex-shrink: 0;
    }
    .modal-footer .btn { flex: 1; padding: 12px; }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <div class="header-title">🏛 정책자금 CRM</div>
      <div class="header-sub">CONSULT_PIPELINE 상담 관리</div>
    </div>
    <button type="button" class="btn btn-outline btn-sm" onclick="loadPipeline()">↻ 새로고침</button>
  </div>
</header>

<div id="loading-overlay"><div class="spinner"></div></div>

<main>
  <div class="settings-bar">
    <label>Google Apps Script URL</label>
    <div class="settings-row">
      <input type="text" id="gas-url" placeholder="https://script.google.com/macros/s/.../exec" />
      <button type="button" class="btn btn-gold btn-sm" onclick="saveGasUrl()">저장</button>
    </div>
  </div>

  <div class="kpi-grid" id="kpi-grid">
    <div class="kpi-card"><div class="kpi-num" id="stat-total">0</div><div class="kpi-label">전체 상담</div></div>
    <div class="kpi-card"><div class="kpi-num" id="stat-new">0</div><div class="kpi-label">신규</div></div>
    <div class="kpi-card"><div class="kpi-num" id="stat-active">0</div><div class="kpi-label">진행중</div></div>
    <div class="kpi-card kpi-success"><div class="kpi-num success" id="stat-done">0</div><div class="kpi-label">완료/계약</div></div>
    <div class="kpi-card kpi-highlight"><div class="kpi-num accent" id="stat-contract">0</div><div class="kpi-label">계약건수</div></div>
    <div class="kpi-card kpi-highlight"><div class="kpi-num accent" id="stat-rate">0%</div><div class="kpi-label">계약률</div><div class="kpi-sub">전체 대비</div></div>
    <div class="kpi-card"><div class="kpi-num" id="stat-month">0</div><div class="kpi-label">이번달 접수</div></div>
    <div class="kpi-card"><div class="kpi-num" id="stat-avgdays">0</div><div class="kpi-label">평균 진행일</div><div class="kpi-sub">접수 기준</div></div>
  </div>

  <div class="filter-bar">
    <div class="filter-row">
      <span class="filter-label">상태</span>
      <div class="status-pills" id="status-pills">
        <button type="button" class="pill active" data-status="전체">전체</button>
        <button type="button" class="pill" data-status="신규">신규</button>
        <button type="button" class="pill" data-status="연락시도">연락시도</button>
        <button type="button" class="pill" data-status="상담중">상담중</button>
        <button type="button" class="pill" data-status="상담완료">상담완료</button>
        <button type="button" class="pill" data-status="계약">계약</button>
        <button type="button" class="pill" data-status="보류">보류</button>
        <button type="button" class="pill" data-status="부적합">부적합</button>
      </div>
    </div>
    <div class="filter-row">
      <span class="filter-label">검색</span>
      <input type="search" class="filter-input" id="search-input" placeholder="업체명 · 연락처 · 접수번호" autocomplete="off" />
      <select class="filter-select" id="date-filter" aria-label="접수일 필터">
        <option value="all">전체 기간</option>
        <option value="today">오늘</option>
        <option value="7d">최근 7일</option>
        <option value="30d">최근 30일</option>
      </select>
      <select class="filter-select" id="assignee-filter" disabled title="다음 단계에서 구현 예정" aria-label="담당자 필터">
        <option value="all">담당자: 전체 (준비중)</option>
      </select>
    </div>
  </div>

  <div class="list-meta" id="list-meta">불러오는 중...</div>
  <div id="consult-list"></div>
</main>

<!-- 상세 모달 -->
<div class="modal-overlay" id="detail-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="detail-modal-title">
  <div class="detail-modal" id="detail-modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div>
        <h2 id="detail-modal-title">상담 상세</h2>
        <div class="sub" id="detail-modal-sub"></div>
      </div>
      <button type="button" class="modal-close" onclick="closeDetailModal()" aria-label="닫기">&times;</button>
    </div>
    <div class="modal-body" id="detail-modal-body"></div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline" style="border-color:var(--gray-300);color:var(--gray-700);" onclick="closeDetailModal()">닫기</button>
      <button type="button" class="btn btn-gold" id="detail-save-btn" onclick="saveDetailFromModal()">저장</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
var DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbwIuNxW3q9W2fCVWE6U6zww9bxydI4R1VlbMT_v03XzRIW-a2_7L8UmtKwKQS6pC62E/exec';
var GAS_URL = localStorage.getItem('policy_admin_gas_url') || localStorage.getItem('policy_match_gas_url') || DEFAULT_GAS_URL;

var pipelineRows = [];
var filterStatus = '전체';
var filterDate = 'all';
var filterAssignee = 'all';
var searchQuery = '';
var detailRow = null;

var STATUS_LIST = ['신규', '연락시도', '상담중', '상담완료', '계약', '보류', '부적합'];

var STATUS_CONFIG = {
  '신규':     { progress: 10,  bar: '#94a3b8' },
  '연락시도': { progress: 25,  bar: '#f59e0b' },
  '상담중':   { progress: 50,  bar: '#3b82f6' },
  '상담완료': { progress: 75,  bar: '#14b8a6' },
  '계약':     { progress: 100, bar: '#22c55e' },
  '보류':     { progress: 40,  bar: '#f97316' },
  '부적합':   { progress: 100, bar: '#ef4444' }
};

function normalizeStatus(status) {
  var s = String(status || '신규').trim();
  return STATUS_CONFIG[s] ? s : '신규';
}

function getStatusProgress(status) {
  var cfg = STATUS_CONFIG[normalizeStatus(status)];
  return cfg ? cfg.progress : 10;
}

function renderProgressBar(status) {
  var s = normalizeStatus(status);
  var pct = getStatusProgress(s);
  var bar = STATUS_CONFIG[s].bar;
  return '<div class="card-progress-wrap">' +
    '<div class="card-progress-track"><div class="card-progress-fill" style="width:' + pct + '%;background:' + bar + '"></div></div>' +
    '<span class="card-progress-pct">' + pct + '%</span></div>';
}

window.onload = function() {
  document.getElementById('gas-url').value = GAS_URL || '';
  bindFilters();
  bindModalClose();
  loadPipeline();
};

function saveGasUrl() {
  var url = document.getElementById('gas-url').value.trim();
  GAS_URL = url;
  if (url) {
    localStorage.setItem('policy_admin_gas_url', url);
    showToast('URL 저장됨');
    loadPipeline();
  } else {
    localStorage.removeItem('policy_admin_gas_url');
    showToast('URL 초기화됨');
  }
}

function getField(row, key, alt) {
  if (!row) return '';
  if (row[key] !== undefined && row[key] !== null && String(row[key]).trim() !== '') {
    return row[key];
  }
  var alts = alt || [];
  for (var i = 0; i < alts.length; i++) {
    var k = alts[i];
    if (row[k] !== undefined && row[k] !== null && String(row[k]).trim() !== '') {
      return row[k];
    }
  }
  return '';
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2800);
}

function showLoading() { document.getElementById('loading-overlay').classList.add('show'); }
function hideLoading() { document.getElementById('loading-overlay').classList.remove('show'); }

function bindFilters() {
  document.getElementById('status-pills').addEventListener('click', function(e) {
    var pill = e.target.closest('.pill');
    if (!pill) return;
    filterStatus = pill.getAttribute('data-status');
    document.querySelectorAll('#status-pills .pill').forEach(function(p) {
      p.classList.toggle('active', p === pill);
    });
    renderList();
  });

  document.getElementById('search-input').addEventListener('input', function(e) {
    searchQuery = e.target.value;
    renderList();
  });

  document.getElementById('date-filter').addEventListener('change', function(e) {
    filterDate = e.target.value;
    renderList();
  });

  document.getElementById('assignee-filter').addEventListener('change', function(e) {
    filterAssignee = e.target.value;
    renderList();
  });
}

function bindModalClose() {
  var overlay = document.getElementById('detail-modal-overlay');
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) closeDetailModal();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && overlay.classList.contains('show')) closeDetailModal();
  });
}

function parseRowDate(row) {
  var raw = getField(row, '접수일시', ['접수일', 'dateTime']);
  if (!raw) return null;
  var d = new Date(raw);
  return isNaN(d.getTime()) ? null : d;
}

function matchDateFilter(row) {
  if (filterDate === 'all') return true;
  var d = parseRowDate(row);
  if (!d) return true;
  var now = new Date();
  var start = new Date(now);
  start.setHours(0, 0, 0, 0);
  if (filterDate === 'today') return d >= start;
  if (filterDate === '7d') {
    start.setDate(start.getDate() - 7);
    return d >= start;
  }
  if (filterDate === '30d') {
    start.setDate(start.getDate() - 30);
    return d >= start;
  }
  return true;
}

function matchSearch(row) {
  var q = (searchQuery || '').trim().toLowerCase();
  if (!q) return true;
  var company = String(getField(row, '업체명', ['company'])).toLowerCase();
  var phone = String(getField(row, '연락처', ['phone']));
  var phoneNorm = phone.replace(/\D/g, '');
  var qNorm = q.replace(/\D/g, '');
  var receipt = String(getField(row, '접수번호', ['receiptNo'])).toLowerCase();
  if (company.indexOf(q) !== -1) return true;
  if (receipt.indexOf(q) !== -1) return true;
  if (phone.toLowerCase().indexOf(q) !== -1) return true;
  if (qNorm.length >= 3 && phoneNorm.indexOf(qNorm) !== -1) return true;
  return false;
}

function getFilteredRows() {
  return pipelineRows.filter(function(row) {
    var status = String(getField(row, '상태', ['status']) || '신규');
    if (filterStatus !== '전체' && status !== filterStatus) return false;
    if (!matchDateFilter(row)) return false;
    if (!matchSearch(row)) return false;
    return true;
  }).sort(function(a, b) {
    var da = parseRowDate(a), db = parseRowDate(b);
    if (!da && !db) return 0;
    if (!da) return 1;
    if (!db) return -1;
    return db - da;
  });
}

function updateStats() {
  var total = pipelineRows.length;
  var nNew = 0, nActive = 0, nDone = 0, nContract = 0;
  var monthCount = 0, daySum = 0, dayCount = 0;
  var now = new Date();
  var monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

  pipelineRows.forEach(function(row) {
    var s = normalizeStatus(getField(row, '상태', ['status']));
    if (s === '신규') nNew++;
    if (s === '연락시도' || s === '상담중' || s === '보류') nActive++;
    if (s === '상담완료' || s === '계약') nDone++;
    if (s === '계약') nContract++;

    var d = parseRowDate(row);
    if (d && d >= monthStart) monthCount++;
    if (d) {
      daySum += Math.max(0, Math.floor((now - d) / 86400000));
      dayCount++;
    }
  });

  var rate = total > 0 ? Math.round((nContract / total) * 100) : 0;
  var avgDays = dayCount > 0 ? Math.round(daySum / dayCount) : 0;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-new').textContent = nNew;
  document.getElementById('stat-active').textContent = nActive;
  document.getElementById('stat-done').textContent = nDone;
  document.getElementById('stat-contract').textContent = nContract;
  document.getElementById('stat-rate').textContent = rate + '%';
  document.getElementById('stat-month').textContent = monthCount;
  document.getElementById('stat-avgdays').textContent = avgDays;
}

function loadPipeline() {
  if (!GAS_URL) {
    showToast('GAS URL을 입력해 주세요.');
    return;
  }
  showLoading();
  fetch(GAS_URL + '?action=getPipeline', { redirect: 'follow' })
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function(text) { return JSON.parse(text); })
    .then(function(data) {
      hideLoading();
      if (data.success && Array.isArray(data.rows)) {
        pipelineRows = data.rows;
        updateStats();
        renderList();
      } else {
        throw new Error(data.error || '데이터 없음');
      }
    })
    .catch(function(err) {
      hideLoading();
      console.warn(err);
      showToast('불러오기 실패: ' + err.message);
      pipelineRows = [];
      updateStats();
      renderList();
    });
}

function renderList() {
  var rows = getFilteredRows();
  var meta = document.getElementById('list-meta');
  meta.textContent = '표시 ' + rows.length + '건 / 전체 ' + pipelineRows.length + '건';

  var container = document.getElementById('consult-list');
  if (rows.length === 0) {
    container.innerHTML = '<div class="empty-state"><h3>표시할 상담이 없습니다</h3><p>필터·검색 조건을 변경하거나 새로고침해 주세요.</p></div>';
    return;
  }

  container.innerHTML = rows.map(function(row, idx) {
    return renderConsultCard(row, idx);
  }).join('');

  container.querySelectorAll('.consult-card').forEach(function(card) {
    card.addEventListener('click', function(e) {
      if (e.target.closest('.card-actions')) return;
      var idx = parseInt(card.getAttribute('data-idx'), 10);
      var filtered = getFilteredRows();
      if (filtered[idx]) openDetailModal(filtered[idx]);
    });
  });

  container.querySelectorAll('[data-save-card]').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var idx = parseInt(btn.getAttribute('data-idx'), 10);
      var filtered = getFilteredRows();
      if (filtered[idx]) saveCardEdits(filtered[idx], idx);
    });
  });
}

function renderConsultCard(row, idx) {
  var status = normalizeStatus(getField(row, '상태', ['status']));
  var company = getField(row, '업체명', ['company']) || '(업체명 없음)';
  var receipt = getField(row, '접수번호', ['receiptNo']);
  var name = getField(row, '신청자명', ['name', '대표자명']);
  var phone = getField(row, '연락처', ['phone']);
  var dt = getField(row, '접수일시', ['접수일', 'dateTime']);
  var policy = getField(row, '관심 사업명', ['policyName', '추천사업']);
  var region = getField(row, '지역', ['region']);
  var consultMemo = getField(row, '상담메모', ['consultMemo', '처리메모']);
  var nextAction = getField(row, '다음액션', ['nextAction']);

  var statusOpts = STATUS_LIST.map(function(s) {
    return '<option value="' + s + '"' + (s === status ? ' selected' : '') + '>' + s + '</option>';
  }).join('');

  return '<article class="consult-card" data-status="' + escapeHtml(status) + '" data-idx="' + idx + '">' +
    renderProgressBar(status) +
    '<span class="status-badge" data-status="' + escapeHtml(status) + '">' + escapeHtml(status) + '</span>' +
    '<div class="card-top"><div class="card-title-block">' +
      '<div class="card-company">' + escapeHtml(company) + '</div>' +
      '<div class="card-receipt">' + escapeHtml(receipt) + '</div>' +
    '</div></div>' +
    '<div class="card-info-grid">' +
      '<div class="card-info-item"><span class="card-info-icon">👤</span><span class="card-info-text">' + escapeHtml(name) + '</span></div>' +
      '<div class="card-info-item"><span class="card-info-icon">📞</span><span class="card-info-text">' + escapeHtml(phone) + '</span></div>' +
      '<div class="card-info-item"><span class="card-info-icon">🕐</span><span class="card-info-text">' + escapeHtml(dt) + '</span></div>' +
      (region ? '<div class="card-info-item"><span class="card-info-icon">📍</span><span class="card-info-text">' + escapeHtml(region) + '</span></div>' : '') +
    '</div>' +
    (policy ? '<div class="card-policy"><span class="card-info-icon">📋</span> ' + escapeHtml(policy) + '</div>' : '') +
    '<div class="card-actions">' +
      '<select data-status-select="' + idx + '" onclick="event.stopPropagation()">' + statusOpts + '</select>' +
      '<textarea placeholder="상담 메모" data-memo="' + idx + '" onclick="event.stopPropagation()">' + escapeHtml(consultMemo) + '</textarea>' +
      '<input type="text" placeholder="다음 액션" data-next="' + idx + '" value="' + escapeHtml(nextAction) + '" onclick="event.stopPropagation()" />' +
      '<button type="button" class="btn btn-save-card btn-sm" data-save-card data-idx="' + idx + '">💾 저장</button>' +
    '</div>' +
  '</article>';
}

function getCardInputs(idx) {
  var container = document.getElementById('consult-list');
  var statusEl = container.querySelector('[data-status-select="' + idx + '"]');
  var memoEl = container.querySelector('[data-memo="' + idx + '"]');
  var nextEl = container.querySelector('[data-next="' + idx + '"]');
  return {
    status: statusEl ? statusEl.value : '',
    consultMemo: memoEl ? memoEl.value.trim() : '',
    nextAction: nextEl ? nextEl.value.trim() : ''
  };
}

function saveCardEdits(row, idx) {
  var inputs = getCardInputs(idx);
  saveConsultUpdate(row, inputs);
}

function saveConsultUpdate(row, fields) {
  var receiptNo = String(getField(row, '접수번호', ['receiptNo']));
  if (!receiptNo || !GAS_URL) return;

  var payload = {
    action: 'updateConsult',
    receiptNo: receiptNo,
    status: fields.status,
    consultMemo: fields.consultMemo,
    nextAction: fields.nextAction,
    processMemo: fields.consultMemo
  };

  showLoading();
  fetch(GAS_URL, {
    method: 'POST',
    redirect: 'follow',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(payload)
  })
  .then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  })
  .then(function(text) { return JSON.parse(text); })
  .then(function(res) {
    hideLoading();
    if (res.success) {
      if (fields.status) row['상태'] = fields.status;
      if (fields.consultMemo !== undefined) {
        row['상담메모'] = fields.consultMemo;
        row['처리메모'] = fields.consultMemo;
      }
      if (fields.nextAction !== undefined) row['다음액션'] = fields.nextAction;
      updateStats();
      renderList();
      if (detailRow && getField(detailRow, '접수번호', ['receiptNo']) === receiptNo) {
        openDetailModal(row);
      }
      showToast('저장되었습니다');
    } else throw new Error(res.error || '저장 실패');
  })
  .catch(function(err) {
    hideLoading();
    showToast('저장 실패: ' + err.message);
  });
}

function renderDetailFieldsGrid(fields, row) {
  var html = '<div class="detail-grid">';
  fields.forEach(function(f) {
    var val = getField(row, f.key, f.alt);
    if (val === '' && f.key !== '상태') return;
    html += '<div class="detail-item' + (f.full ? ' full' : '') + '">' +
      '<div class="detail-label">' + escapeHtml(f.key) + '</div>' +
      '<div class="detail-value">' + escapeHtml(val === '' ? '-' : val) + '</div>' +
    '</div>';
  });
  return html + '</div>';
}

var DETAIL_SECTIONS = {
  basic: [
    { key: '접수번호', alt: ['receiptNo'], full: false },
    { key: '접수일시', alt: ['접수일', 'dateTime'], full: false },
    { key: '상태', alt: ['status'], full: false },
    { key: '업체명', alt: ['company'], full: false },
    { key: '신청자명', alt: ['name', '대표자명'], full: false },
    { key: '연락처', alt: ['phone'], full: false },
    { key: '지역', alt: ['region'], full: false },
    { key: '업종', alt: ['industry'], full: false },
    { key: '사업자유형', alt: ['bizType'], full: false }
  ],
  consult: [
    { key: '관심 사업명', alt: ['policyName', '추천사업'], full: true },
    { key: '희망 상담시간', alt: ['preferTime'], full: false },
    { key: '자금목적', alt: ['purposes', '자금필요목적'], full: true },
    { key: '문의내용', alt: ['memo'], full: true },
    { key: '애로사항', alt: ['trouble'], full: true }
  ],
  progress: [
    { key: '창업연수', alt: ['bizAge'], full: false },
    { key: '연매출(만원)', alt: ['revenue', '연매출'], full: false },
    { key: '종업원수', alt: ['employees'], full: false },
    { key: '다음액션', alt: ['nextAction'], full: true }
  ],
  memo: [
    { key: '상담메모', alt: ['consultMemo'], full: true },
    { key: '처리메모', alt: ['processMemo'], full: true }
  ]
};

function openDetailModal(row) {
  detailRow = row;
  var company = getField(row, '업체명', ['company']) || '(업체명 없음)';
  var receipt = getField(row, '접수번호', ['receiptNo']);
  var status = normalizeStatus(getField(row, '상태', ['status']));
  var pct = getStatusProgress(status);

  document.getElementById('detail-modal-title').textContent = company;
  document.getElementById('detail-modal-sub').textContent = receipt;

  var consultMemo = getField(row, '상담메모', ['consultMemo', '처리메모']);
  var nextAction = getField(row, '다음액션', ['nextAction']);
  var statusOpts = STATUS_LIST.map(function(s) {
    return '<option value="' + s + '"' + (s === status ? ' selected' : '') + '>' + s + '</option>';
  }).join('');

  var html = '<div class="modal-status-banner" data-status="' + escapeHtml(status) + '">● ' + escapeHtml(status) + ' · 진행률 ' + pct + '%</div>';
  html += '<div class="modal-section"><div class="modal-section-title">기본정보</div>' + renderDetailFieldsGrid(DETAIL_SECTIONS.basic, row) + '</div>';
  html += '<div class="modal-section"><div class="modal-section-title">상담정보</div>' + renderDetailFieldsGrid(DETAIL_SECTIONS.consult, row) + '</div>';
  html += '<div class="modal-section"><div class="modal-section-title">진행정보</div>' + renderDetailFieldsGrid(DETAIL_SECTIONS.progress, row) + '</div>';
  html += '<div class="modal-section"><div class="modal-section-title">메모</div>' + renderDetailFieldsGrid(DETAIL_SECTIONS.memo, row) + '</div>';
  html += '<div class="modal-section modal-edit"><div class="modal-section-title">상담 처리</div>' +
    '<div class="form-group"><label>상태 변경</label><select id="detail-status">' + statusOpts + '</select></div>' +
    '<div class="form-group"><label>상담 메모</label><textarea id="detail-memo" class="modal-textarea">' + escapeHtml(consultMemo) + '</textarea></div>' +
    '<div class="form-group"><label>다음 액션</label><textarea id="detail-next" class="modal-textarea" rows="2">' + escapeHtml(nextAction) + '</textarea></div>' +
  '</div>';
  html += '<div class="modal-section modal-section-future"><div class="modal-section-title">승인·집행 (준비중)</div>' +
    '<div class="form-row-2">' +
      '<div class="form-group"><label>승인여부</label><select id="detail-approved" disabled><option>미정</option><option>승인</option><option>미승인</option></select></div>' +
      '<div class="form-group"><label>승인금액 (원)</label><input type="text" id="detail-approved-amt" placeholder="예: 50000000" disabled /></div>' +
    '</div>' +
    '<div class="form-group"><label>실행금액 (원)</label><input type="text" id="detail-executed-amt" placeholder="예: 30000000" disabled /></div>' +
    '<p class="field-hint">추후 KPI 연동 예정 · 현재는 저장되지 않습니다.</p></div>';

  document.getElementById('detail-modal-body').innerHTML = html;
  document.getElementById('detail-modal-overlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeDetailModal() {
  document.getElementById('detail-modal-overlay').classList.remove('show');
  document.body.style.overflow = '';
  detailRow = null;
}

function saveDetailFromModal() {
  if (!detailRow) return;
  saveConsultUpdate(detailRow, {
    status: document.getElementById('detail-status').value,
    consultMemo: document.getElementById('detail-memo').value.trim(),
    nextAction: document.getElementById('detail-next').value.trim()
  });
}
</script>
</body>
</html>
