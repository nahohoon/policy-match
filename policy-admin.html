<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>정책자금 CRM 관리 | 나호훈 경영컨설팅</title>
  <style>
    :root {
      --navy: #0F2448;
      --navy-light: #1a3a6e;
      --navy-dark: #091830;
      --gold: #c9a84c;
      --gold-light: #e5c878;
      --gold-pale: #fdf6e3;
      --white: #ffffff;
      --gray-50: #f8fafc;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-300: #cbd5e1;
      --gray-400: #94a3b8;
      --gray-500: #64748b;
      --gray-600: #475569;
      --gray-700: #334155;
      --gray-800: #1e293b;
      --green: #16a34a;
      --green-light: #dcfce7;
      --yellow: #d97706;
      --yellow-light: #fef3c7;
      --red: #dc2626;
      --red-light: #fee2e2;
      --teal: #0d9488;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(15,36,72,0.10);
      --shadow-lg: 0 8px 40px rgba(15,36,72,0.18);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      background: var(--gray-50);
      color: var(--gray-800);
      min-height: 100vh;
    }
    header {
      background: var(--navy);
      padding: 14px 16px;
      position: sticky; top: 0; z-index: 50;
      box-shadow: 0 2px 16px rgba(0,0,0,0.2);
    }
    .header-inner {
      max-width: 1100px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .header-title { color: var(--white); font-size: 17px; font-weight: 800; }
    .header-sub { color: var(--gold-light); font-size: 12px; font-weight: 400; margin-top: 2px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 700;
      border: none; cursor: pointer; font-family: inherit; transition: all 0.2s; text-decoration: none;
    }
    .btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: var(--navy); }
    .btn-outline { background: transparent; color: var(--white); border: 1.5px solid rgba(255,255,255,0.35); }
    .btn-primary { background: var(--navy-light); color: var(--white); }
    .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 6px; }
    main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }
    .settings-bar {
      background: var(--navy-dark); border-radius: var(--radius);
      padding: 14px 16px; margin-bottom: 16px; border: 1px solid rgba(201,168,76,0.2);
    }
    .settings-bar label { color: var(--gold-light); font-size: 12px; font-weight: 600; display: block; margin-bottom: 6px; }
    .settings-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .settings-row input {
      flex: 1; min-width: 200px; padding: 8px 12px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.08);
      color: var(--white); font-size: 13px; font-family: monospace;
    }
    .kpi-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 10px; margin-bottom: 14px;
    }
    @media (min-width: 640px) { .kpi-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 960px) { .kpi-grid { grid-template-columns: repeat(4, 1fr); } }
    .kpi-grid.performance-grid { margin-top: 0; margin-bottom: 14px; }
    .performance-panel-title {
      font-size: 13px; font-weight: 800; color: var(--navy);
      margin-bottom: 10px; padding-left: 2px;
    }
    .kpi-card {
      background: var(--white); border-radius: var(--radius); padding: 14px 12px;
      box-shadow: var(--shadow); text-align: center; border: 1px solid var(--gray-100);
    }
    .kpi-num { font-size: 22px; font-weight: 800; color: var(--navy); line-height: 1.2; }
    .kpi-label { font-size: 11px; color: var(--gray-500); margin-top: 4px; font-weight: 600; }
    .kpi-card.accent-gold .kpi-num { color: var(--gold); }
    .kpi-card.accent-green .kpi-num { color: var(--green); }
    .today-panel {
      background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 100%);
      border-radius: var(--radius); padding: 16px; margin-bottom: 16px;
      border: 1px solid rgba(201,168,76,0.25);
    }
    .today-panel-title { color: var(--gold-light); font-size: 14px; font-weight: 800; margin-bottom: 12px; }
    .today-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    @media (max-width: 520px) { .today-grid { grid-template-columns: 1fr; } }
    .today-chip {
      background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: 10px; padding: 12px 10px; cursor: pointer; text-align: center;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      font-family: inherit; color: inherit;
    }
    .today-chip:hover { background: rgba(255,255,255,0.14); transform: translateY(-1px); }
    .today-chip.active { border-color: var(--gold); background: rgba(201,168,76,0.18); }
    .today-chip-num { font-size: 24px; font-weight: 800; color: var(--white); }
    .today-chip-label { font-size: 11px; color: rgba(255,255,255,0.75); margin-top: 4px; font-weight: 600; }
    .today-chip-danger .today-chip-num { color: #fca5a5; }
    .today-chip-warn .today-chip-num { color: #fde68a; }
    .filter-bar {
      background: var(--white); border-radius: var(--radius); padding: 14px 16px;
      box-shadow: var(--shadow); margin-bottom: 16px;
    }
    .filter-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .filter-row + .filter-row { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--gray-100); }
    .filter-label { font-size: 12px; font-weight: 700; color: var(--gray-600); min-width: 52px; }
    .status-pills { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
    .pill {
      padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
      border: 1.5px solid var(--gray-200); background: var(--white); color: var(--gray-600);
      cursor: pointer; transition: all 0.15s;
    }
    .pill.active { color: var(--white); border-color: transparent; }
    .pill[data-status="전체"].active { background: var(--navy); }
    .pill[data-status="신규"] { border-color: #cbd5e1; }
    .pill[data-status="신규"].active { background: #64748b; color: #fff; }
    .pill[data-status="연락시도"] { border-color: #fde68a; }
    .pill[data-status="연락시도"].active { background: #d97706; color: #fff; }
    .pill[data-status="상담중"] { border-color: #93c5fd; }
    .pill[data-status="상담중"].active { background: #2563eb; color: #fff; }
    .pill[data-status="상담완료"] { border-color: #5eead4; }
    .pill[data-status="상담완료"].active { background: #0d9488; color: #fff; }
    .pill[data-status="계약"] { border-color: #86efac; }
    .pill[data-status="계약"].active { background: #16a34a; color: #fff; }
    .pill[data-status="보류"] { border-color: #fdba74; }
    .pill[data-status="보류"].active { background: #ea580c; color: #fff; }
    .pill[data-status="부적합"] { border-color: #fca5a5; }
    .pill[data-status="부적합"].active { background: #dc2626; color: #fff; }
    .filter-input, .filter-select {
      padding: 8px 12px; border: 1.5px solid var(--gray-200); border-radius: 8px;
      font-size: 13px; font-family: inherit; color: var(--gray-800); background: var(--white); min-width: 0;
    }
    .filter-input { flex: 1; min-width: 140px; }
    .filter-select { min-width: 120px; }
    .filter-select:disabled { opacity: 0.55; cursor: not-allowed; background: var(--gray-50); }
    .list-meta { font-size: 13px; color: var(--gray-500); margin-bottom: 12px; }
    #consult-list { display: flex; flex-direction: column; gap: 10px; }
    @media (max-width: 480px) { #consult-list { gap: 8px; } }
    .consult-card {
      background: var(--white); border-radius: 14px; box-shadow: var(--shadow);
      padding: 0; border-left: 4px solid var(--gray-300);
      transition: box-shadow 0.22s, transform 0.18s, border-color 0.2s;
      position: relative; overflow: hidden;
    }
    .consult-card:hover { box-shadow: var(--shadow-lg); }
    .consult-card.is-stale {
      border-left-color: var(--red) !important;
      box-shadow: 0 0 0 1px rgba(220,38,38,0.15), 0 4px 20px rgba(220,38,38,0.12);
    }
    .consult-card[data-status="신규"] { border-left-color: #94a3b8; }
    .consult-card[data-status="연락시도"] { border-left-color: #eab308; }
    .consult-card[data-status="상담중"] { border-left-color: #3b82f6; }
    .consult-card[data-status="상담완료"] { border-left-color: #14b8a6; }
    .consult-card[data-status="계약"] { border-left-color: #16a34a; }
    .consult-card[data-status="보류"] { border-left-color: #f97316; }
    .consult-card[data-status="부적합"] { border-left-color: #dc2626; }
    .consult-card.is-approved {
      border-left-color: #16a34a !important;
      box-shadow: 0 0 0 1px rgba(22,163,74,0.22), 0 6px 28px rgba(22,163,74,0.18);
    }
    .consult-card.is-approved .card-progress-fill {
      background: linear-gradient(90deg, #16a34a, #4ade80) !important;
      box-shadow: 0 0 8px rgba(22,163,74,0.45);
    }
    .consult-card.approval-denied {
      border-left-color: var(--gray-300) !important;
      opacity: 0.88;
    }
    .consult-card.approval-denied .card-company { color: var(--gray-600); }
    .approval-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 6px;
      background: var(--green-light); color: var(--green); margin-bottom: 6px;
    }
    .approval-badge.denied { background: var(--gray-100); color: var(--gray-500); }
    .card-perf-summary {
      display: flex; flex-wrap: wrap; gap: 8px 12px;
      font-size: 11px; font-weight: 700; margin-bottom: 8px; line-height: 1.4;
    }
    .card-perf-approved { color: var(--green); }
    .card-perf-executed { color: var(--navy-light); }
    .card-summary { padding: 12px 14px 10px; cursor: pointer; }
    .card-expand {
      max-height: 800px; opacity: 1; overflow: hidden;
      transition: max-height 0.35s ease, opacity 0.28s ease, padding 0.28s ease;
      padding: 0 14px 14px; border-top: 1px solid var(--gray-100);
    }
    .consult-card.collapsed .card-expand {
      max-height: 0; opacity: 0; padding-top: 0; padding-bottom: 0;
      border-top-color: transparent; pointer-events: none;
    }
    .priority-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
      margin-bottom: 6px;
    }
    .priority-badge.urgent { background: #fee2e2; color: #b91c1c; }
    .priority-badge.warn { background: #fef3c7; color: #b45309; }
    .priority-badge.normal { background: #dcfce7; color: #15803d; }
    .card-progress-wrap {
      display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
    }
    .card-progress-track {
      flex: 1; height: 5px; background: var(--gray-100); border-radius: 99px; overflow: hidden;
    }
    .card-progress-fill { height: 100%; border-radius: 99px; transition: width 0.3s; }
    .card-progress-pct { font-size: 11px; font-weight: 700; color: var(--gray-500); min-width: 32px; text-align: right; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
    .card-title-block { flex: 1; min-width: 0; }
    .card-company { font-size: 16px; font-weight: 800; color: var(--navy); line-height: 1.3; }
    .card-receipt { font-size: 11px; color: var(--gray-400); margin-top: 2px; }
    .status-badge {
      position: absolute; top: 10px; right: 12px;
      padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap;
    }
    .status-badge[data-status="신규"] { background: #f1f5f9; color: #64748b; }
    .status-badge[data-status="연락시도"] { background: #fef3c7; color: #b45309; }
    .status-badge[data-status="상담중"] { background: #dbeafe; color: #1d4ed8; }
    .status-badge[data-status="상담완료"] { background: #ccfbf1; color: #0f766e; }
    .status-badge[data-status="계약"] { background: var(--green-light); color: var(--green); }
    .status-badge[data-status="보류"] { background: #ffedd5; color: #c2410c; }
    .status-badge[data-status="부적합"] { background: #fee2e2; color: var(--red); }
    .card-info-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 10px;
      font-size: 12px; color: var(--gray-600); margin-bottom: 8px;
    }
    @media (min-width: 480px) { .card-info-grid { grid-template-columns: repeat(3, 1fr); } }
    .card-info-item { display: flex; align-items: center; gap: 4px; min-width: 0; }
    .card-info-icon { flex-shrink: 0; }
    .card-info-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-stale-msg {
      font-size: 11px; font-weight: 700; color: var(--red); margin-bottom: 6px;
    }
    .card-status-hint {
      font-size: 11px; color: var(--gray-500); font-style: italic; margin-bottom: 8px; line-height: 1.4;
    }
    .card-quick-actions {
      display: flex; gap: 6px; justify-content: flex-end; margin-top: 4px;
    }
    .btn-quick {
      width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--gray-200);
      background: var(--gray-50); font-size: 15px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      transition: background 0.15s, transform 0.12s;
    }
    .btn-quick:hover { background: var(--gray-100); transform: scale(1.05); }
    .btn-quick:disabled { opacity: 0.4; cursor: not-allowed; }
    .card-expand .form-row { margin-bottom: 10px; }
    .card-expand label { display: block; font-size: 11px; font-weight: 700; color: var(--gray-600); margin-bottom: 4px; }
    .card-expand select, .card-expand textarea, .card-expand input[type="date"], .card-expand input[type="text"] {
      width: 100%; font-size: 12px; padding: 8px 10px; border-radius: 8px;
      border: 1.5px solid var(--gray-200); font-family: inherit;
    }
    .card-expand textarea { min-height: 56px; resize: vertical; }
    .btn-save-card {
      width: 100%; margin-top: 4px; padding: 10px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: var(--navy); font-weight: 800; border: none; border-radius: 8px; cursor: pointer;
      font-size: 13px; font-family: inherit;
    }
    .empty-state {
      text-align: center; padding: 48px 20px; background: var(--white);
      border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .empty-state h3 { color: var(--navy); margin-bottom: 8px; }
    .empty-state p { color: var(--gray-500); font-size: 14px; }
    #loading-overlay {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(9,24,48,0.75); align-items: center; justify-content: center;
    }
    #loading-overlay.show { display: flex; }
    .spinner {
      width: 44px; height: 44px; border: 3px solid rgba(255,255,255,0.2);
      border-top-color: var(--gold); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--navy); color: var(--white); padding: 10px 20px;
      border-radius: 99px; font-size: 13px; font-weight: 600; z-index: 300;
      opacity: 0; transition: opacity 0.3s; pointer-events: none; max-width: 90vw; text-align: center;
    }
    #toast.show { opacity: 1; }
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 150;
      background: rgba(9,24,48,0.65); backdrop-filter: blur(3px);
      padding: 16px; align-items: flex-end; justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    @media (min-width: 640px) { .modal-overlay { align-items: center; padding: 24px; } }
    .detail-modal {
      background: var(--white); border-radius: 16px 16px 0 0;
      width: 100%; max-width: 560px; max-height: min(92vh, 720px);
      display: flex; flex-direction: column; box-shadow: var(--shadow-lg);
      animation: slideUp 0.25s ease;
    }
    @media (min-width: 640px) {
      .detail-modal { border-radius: 16px; max-height: min(88vh, 720px); }
    }
    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-header {
      padding: 18px 20px 14px; border-bottom: 1px solid var(--gray-100);
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-shrink: 0;
    }
    .modal-header h2 { font-size: 18px; font-weight: 800; color: var(--navy); line-height: 1.35; }
    .modal-header .sub { font-size: 12px; color: var(--gray-500); margin-top: 4px; }
    .modal-status-banner {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-top: 10px;
    }
    .modal-status-banner[data-status="신규"] { background: #f1f5f9; color: #64748b; }
    .modal-status-banner[data-status="연락시도"] { background: #fef3c7; color: #b45309; }
    .modal-status-banner[data-status="상담중"] { background: #dbeafe; color: #1d4ed8; }
    .modal-status-banner[data-status="상담완료"] { background: #ccfbf1; color: #0f766e; }
    .modal-status-banner[data-status="계약"] { background: var(--green-light); color: var(--green); }
    .modal-status-banner[data-status="보류"] { background: #ffedd5; color: #c2410c; }
    .modal-status-banner[data-status="부적합"] { background: #fee2e2; color: var(--red); }
    .modal-close {
      width: 36px; height: 36px; border-radius: 50%; border: none;
      background: var(--gray-100); color: var(--gray-600); font-size: 20px;
      cursor: pointer; flex-shrink: 0; line-height: 1;
    }
    .modal-body {
      padding: 16px 20px; overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch;
    }
    .detail-section { margin-bottom: 18px; }
    .detail-section-title {
      font-size: 13px; font-weight: 800; color: var(--navy);
      padding: 6px 12px; background: var(--gray-100);
      border-left: 3px solid var(--gold); border-radius: 0 6px 6px 0; margin-bottom: 10px;
    }
    .detail-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 480px) { .detail-grid { grid-template-columns: 1fr 1fr; } }
    .detail-item { background: var(--gray-50); border-radius: 8px; padding: 10px 12px; }
    .detail-item.full { grid-column: 1 / -1; }
    .detail-label { font-size: 11px; font-weight: 700; color: var(--gray-400); margin-bottom: 4px; }
    .detail-value { font-size: 13px; font-weight: 600; color: var(--gray-800); line-height: 1.5; word-break: break-word; }
    .modal-edit { margin-top: 8px; padding-top: 16px; border-top: 1px solid var(--gray-100); }
    .modal-edit h3 { font-size: 14px; font-weight: 800; color: var(--navy); margin-bottom: 12px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--gray-700); margin-bottom: 6px; }
    .form-group select, .form-group textarea, .form-group input[type="date"],
    .form-group input[type="number"] {
      width: 100%; padding: 10px 12px; border: 1.5px solid var(--gray-200);
      border-radius: 8px; font-size: 14px; font-family: inherit;
    }
    .form-group textarea { min-height: 72px; resize: vertical; }
    .modal-textarea { min-height: 88px; }
    .approval-note { font-size: 11px; color: var(--gray-400); margin-top: 6px; }
    .modal-footer {
      padding: 14px 20px 20px; border-top: 1px solid var(--gray-100);
      display: flex; gap: 10px; flex-shrink: 0;
    }
    .modal-footer .btn { flex: 1; padding: 12px; }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <div class="header-title">🏛 정책자금 CRM</div>
      <div class="header-sub">CONSULT_PIPELINE 상담 관리</div>
    </div>
    <button type="button" class="btn btn-outline btn-sm" onclick="loadPipeline()">↻ 새로고침</button>
  </div>
</header>

<div id="loading-overlay"><div class="spinner"></div></div>

<main>
  <div class="settings-bar">
    <label>Google Apps Script URL</label>
    <div class="settings-row">
      <input type="text" id="gas-url" placeholder="https://script.google.com/macros/s/.../exec" />
      <button type="button" class="btn btn-gold btn-sm" onclick="saveGasUrl()">저장</button>
    </div>
  </div>

  <div class="kpi-grid" id="kpi-grid">

  <section class="today-panel" id="today-panel" aria-label="오늘 할 일">

  <div class="detail-modal" id="detail-modal" onclick="event.stopPropagation()">

        <h2 id="detail-modal-title">상담 상세</h2>
        <div class="sub" id="detail-modal-sub"></div>
        <div class="modal-status-banner" id="detail-modal-status" data-status="신규">신규</div>
      </div>
      <button type="button" class="modal-close" onclick="closeDetailModal()" aria-label="닫기">&times;</button>

      <button type="button" class="btn btn-outline" style="border-color:var(--gray-300);color:var(--gray-700);" onclick="closeDetailModal()">닫기</button>

    </div>

<div id="toast"></div>

<script>
var DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbwIuNxW3q9W2fCVWE6U6zww9bxydI4R1VlbMT_v03XzRIW-a2_7L8UmtKwKQS6pC62E/exec';
var GAS_URL = localStorage.getItem('policy_admin_gas_url') || localStorage.getItem('policy_match_gas_url') || DEFAULT_GAS_URL;

var pipelineRows = [];
var filterStatus = '전체';
var filterDate = 'all';
var filterAssignee = 'all';
var searchQuery = '';
var workFocus = '';
var detailRow = null;

var STATUS_LIST = ['신규', '연락시도', '상담중', '상담완료', '계약', '보류', '부적합'];

var STATUS_CONFIG = {
  '신규': { pct: 10, bar: '#94a3b8' },
  '연락시도': { pct: 25, bar: '#eab308' },
  '상담중': { pct: 50, bar: '#3b82f6' },
  '상담완료': { pct: 75, bar: '#14b8a6' },
  '계약': { pct: 100, bar: '#16a34a' },
  '보류': { pct: 40, bar: '#f97316' },
  '부적합': { pct: 100, bar: '#dc2626' }
};

var TERMINAL_STATUSES = { '계약': true, '부적합': true };

var DETAIL_SECTIONS = [
  { title: '기본정보', fields: [
    { key: '접수번호', alt: ['receiptNo'] },
    { key: '접수일시', alt: ['접수일', 'dateTime'] },
    { key: '상태', alt: ['status'] },
    { key: '업체명', alt: ['company'] },
    { key: '신청자명', alt: ['name', '대표자명'] },
    { key: '연락처', alt: ['phone'] }
  ]},
  { title: '상담정보', fields: [
    { key: '관심 사업명', alt: ['policyName', '추천사업'], full: true },
    { key: '희망 상담시간', alt: ['preferTime'] },
    { key: '지역', alt: ['region'] },
    { key: '업종', alt: ['industry'] },
    { key: '사업자유형', alt: ['bizType'] }
  ]},
  { title: '진행정보', fields: [
    { key: '창업연수', alt: ['bizAge'] },
    { key: '연매출(만원)', alt: ['revenue', '연매출'] },
    { key: '종업원수', alt: ['employees'] },
    { key: '자금목적', alt: ['purposes', '자금필요목적'], full: true },
    { key: '다음액션', alt: ['nextAction'] },
    { key: '다음액션예정일', alt: ['nextActionDate'] }
  ]},
  { title: '성과', fields: [
    { key: '승인여부', alt: ['approvalStatus'] },
    { key: '승인금액', alt: ['approvalAmount'] },
    { key: '실행금액', alt: ['executionAmount'] }
  ]},
  { title: '메모', fields: [
    { key: '문의내용', alt: ['memo'], full: true },
    { key: '애로사항', alt: ['trouble'], full: true },
    { key: '상담메모', alt: ['consultMemo'], full: true },
    { key: '처리메모', alt: ['processMemo'], full: true }
  ]}
];

function normalizeStatus(s) {
  var v = String(s || '신규').trim();
  if (STATUS_CONFIG[v]) return v;
  if (v === '상담완료') return '상담완료';
  return '신규';
}

function getStatusProgress(status) {
  var s = normalizeStatus(status);
  return (STATUS_CONFIG[s] || STATUS_CONFIG['신규']).pct;
}

function getApprovalStatus(row) {
  var v = String(getField(row, '승인여부', ['approvalStatus'])).trim();
  if (v === '승인' || v === '미승인') return v;
  return '미정';
}

function isApproved(row) {
  return getApprovalStatus(row) === '승인';
}

function isApprovalDenied(row) {
  return getApprovalStatus(row) === '미승인';
}

function parseAmount(raw) {
  if (raw === '' || raw === null || raw === undefined) return 0;
  if (typeof raw === 'number' && !isNaN(raw)) return raw;
  var s = String(raw).replace(/[^\d.-]/g, '');
  var n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function getApprovalAmount(row) {
  return parseAmount(getField(row, '승인금액', ['approvalAmount']));
}

function getExecutionAmount(row) {
  return parseAmount(getField(row, '실행금액', ['executionAmount']));
}

function formatAmountKo(n) {
  return parseAmount(n).toLocaleString('ko-KR');
}

function needsExecutionRegistration(row) {
  return isApproved(row) && !getExecutionAmount(row);
}

function needsApprovalResultCheck(row) {
  var status = normalizeStatus(getField(row, '상태', ['status']));
  return status === '상담완료' && getApprovalStatus(row) === '미정';
}

function isInCurrentMonthByReceipt(row) {
  var d = parseRowDate(row);
  if (!d) return false;
  var now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
}

function calcPerformanceStats(rows) {
  var totalApprovalAmt = 0, totalExecutionAmt = 0, approvalCount = 0;
  var monthApprovalCount = 0, monthApprovalAmt = 0;
  var total = rows.length;

  rows.forEach(function(row) {
    if (!isApproved(row)) return;
    approvalCount++;
    var aa = getApprovalAmount(row);
    var ea = getExecutionAmount(row);
    totalApprovalAmt += aa;
    totalExecutionAmt += ea;
    if (isInCurrentMonthByReceipt(row)) {
      monthApprovalCount++;
      monthApprovalAmt += aa;
    }
  });

  return {
    totalApprovalAmt: totalApprovalAmt,
    totalExecutionAmt: totalExecutionAmt,
    approvalCount: approvalCount,
    approvalRate: total ? Math.round((approvalCount / total) * 100) : 0,
    monthApprovalCount: monthApprovalCount,
    monthApprovalAmt: monthApprovalAmt
  };
}

function renderCardPerfSummary(row) {
  var parts = [];
  var approvalStatus = getApprovalStatus(row);
  var approvalAmt = getApprovalAmount(row);
  var executionAmt = getExecutionAmount(row);

  if (approvalStatus === '승인') {
    var approvedLabel = approvalAmt
      ? '🟢 승인 ' + formatAmountKo(approvalAmt) + '만원'
      : '🟢 승인';
    parts.push('<span class="card-perf-approved">' + approvedLabel + '</span>');
  }
  if (executionAmt) {
    parts.push('<span class="card-perf-executed">💰 실행 ' + formatAmountKo(executionAmt) + '만원</span>');
  }
  if (!parts.length) return '';
  return '<div class="card-perf-summary">' + parts.join('') + '</div>';
}

function renderApprovalBadge(row) {
  if (isApproved(row)) return '<div class="approval-badge">🟢 승인완료</div>';
  if (isApprovalDenied(row)) return '<div class="approval-badge denied">미승인</div>';
  return '';
}

function startOfDay(d) {
  var x = new Date(d);
  x.setHours(0, 0, 0, 0);
  return x;
}

function parseDateAny(raw) {
  if (!raw) return null;
  if (raw instanceof Date && !isNaN(raw.getTime())) return raw;
  var s = String(raw).trim();
  if (!s) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
    var p = s.split('-');
    return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
  }
  var d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

function toDateInputValue(raw) {
  var d = parseDateAny(raw);
  if (!d) return '';
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function daysBetween(a, b) {
  var ms = startOfDay(b) - startOfDay(a);
  return Math.floor(ms / 86400000);
}

function getLastModifiedDate(row) {
  var raw = getField(row, '최종수정일', ['lastModified', '수정일시']);
  if (!raw) raw = getField(row, '접수일시', ['접수일', 'dateTime']);
  return parseDateAny(raw);
}

function getNextActionDate(row) {
  return parseDateAny(getField(row, '다음액션예정일', ['nextActionDate']));
}

function isTerminalStatus(status) {
  return !!TERMINAL_STATUSES[normalizeStatus(status)];
}

function isStaleConsult(row) {
  if (isTerminalStatus(getField(row, '상태', ['status']))) return false;
  var d = getLastModifiedDate(row);
  if (!d) return false;
  return daysBetween(d, new Date()) >= 3;
}

function isNewNoContact(row) {
  if (normalizeStatus(getField(row, '상태', ['status'])) !== '신규') return false;
  var d = parseRowDate(row);
  if (!d) return false;
  return daysBetween(d, new Date()) >= 2;
}

function isActionDueToday(row) {
  var nd = getNextActionDate(row);
  if (!nd) return false;
  return daysBetween(nd, new Date()) === 0;
}

function isActionOverdue(row) {
  var nd = getNextActionDate(row);
  if (!nd) return false;
  return startOfDay(nd) < startOfDay(new Date());
}

function getConsultPriority(row) {
  var status = normalizeStatus(getField(row, '상태', ['status']));
  if (isNewNoContact(row)) return 'urgent';
  if ((status === '상담중' || status === '연락시도') && isActionOverdue(row)) return 'urgent';
  if (needsExecutionRegistration(row) || needsApprovalResultCheck(row)) return 'warn';
  if (isActionDueToday(row)) return 'warn';
  if (isStaleConsult(row)) return 'warn';
  return 'normal';
}

function priorityRank(p) {
  if (p === 'urgent') return 0;
  if (p === 'warn') return 1;
  return 2;
}

function compareRowPriority(a, b) {
  var pa = getConsultPriority(a), pb = getConsultPriority(b);
  var ra = priorityRank(pa), rb = priorityRank(pb);
  if (ra !== rb) return ra - rb;
  if (isActionDueToday(a) && !isActionDueToday(b)) return -1;
  if (!isActionDueToday(a) && isActionDueToday(b)) return 1;
  if (normalizeStatus(getField(a, '상태', ['status'])) === '신규' && normalizeStatus(getField(b, '상태', ['status'])) !== '신규') return -1;
  if (normalizeStatus(getField(a, '상태', ['status'])) !== '신규' && normalizeStatus(getField(b, '상태', ['status'])) === '신규') return 1;
  var da = getLastModifiedDate(a), db = getLastModifiedDate(b);
  if (da && db) return db - da;
  var ra2 = parseRowDate(a), rb2 = parseRowDate(b);
  if (ra2 && rb2) return rb2 - ra2;
  return 0;
}

function renderPriorityBadge(row) {
  var p = getConsultPriority(row);
  var label = p === 'urgent' ? '🔴 긴급' : (p === 'warn' ? '🟡 주의' : '🟢 정상');
  return '<div class="priority-badge ' + p + '">' + label + '</div>';
}

function getStatusHint(row) {
  var status = normalizeStatus(getField(row, '상태', ['status']));
  var memo = String(getField(row, '상담메모', ['consultMemo', '처리메모'])).trim();
  var next = String(getField(row, '다음액션', ['nextAction'])).trim();
  var nextDate = getField(row, '다음액션예정일', ['nextActionDate']);
  if (needsExecutionRegistration(row)) return '실행 등록 필요';
  if (needsApprovalResultCheck(row)) return '승인결과 확인 필요';
  if (status === '신규' && memo) return '연락시도 권장';
  if (status === '신규' && isNewNoContact(row)) return '신규 미연락 — 우선 연락 필요';
  if (status === '상담완료' && !next && !nextDate) return '후속일정 필요';
  if (status === '계약') {
    var approvedAmt = String(getField(row, '승인금액', ['approvedAmount', '승인금액(원)'])).trim();
    if (!approvedAmt) return '금액 입력 필요';
  }
  if (isActionOverdue(row)) return '예정일 경과 — 즉시 후속 필요';
  if (isActionDueToday(row)) return '오늘 예정 액션';
  if (isStaleConsult(row)) return '3일 이상 업데이트 없음';
  return '';
}

function matchWorkFocus(row) {
  if (!workFocus) return true;
  if (workFocus === 'today') return isActionDueToday(row) || isActionOverdue(row);
  if (workFocus === 'stale') return isStaleConsult(row);
  if (workFocus === 'newNoContact') return isNewNoContact(row);
  return true;
}

window.onload = function() {
  document.getElementById('gas-url').value = GAS_URL || '';
  bindFilters();
  bindModalClose();
  bindTodayPanel();
  loadPipeline();
};

function saveGasUrl() {
  var url = document.getElementById('gas-url').value.trim();
  GAS_URL = url;
  if (url) {
    localStorage.setItem('policy_admin_gas_url', url);
    showToast('URL 저장됨');
    loadPipeline();
  } else {
    localStorage.removeItem('policy_admin_gas_url');
    showToast('URL 초기화됨');
  }
}

function getField(row, key, alt) {
  if (!row) return '';
  if (row[key] !== undefined && row[key] !== null && String(row[key]).trim() !== '') return row[key];
  var alts = alt || [];
  for (var i = 0; i < alts.length; i++) {
    var k = alts[i];
    if (row[k] !== undefined && row[k] !== null && String(row[k]).trim() !== '') return row[k];
  }
  return '';
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2800);
}

function showLoading() { document.getElementById('loading-overlay').classList.add('show'); }
function hideLoading() { document.getElementById('loading-overlay').classList.remove('show'); }

function bindTodayPanel() {
  document.getElementById('today-grid').addEventListener('click', function(e) {
    var chip = e.target.closest('.today-chip');
    if (!chip) return;
    var focus = chip.getAttribute('data-work-focus');
    if (workFocus === focus) {
      workFocus = '';
      document.querySelectorAll('.today-chip').forEach(function(c) { c.classList.remove('active'); });
    } else {
      workFocus = focus;
      document.querySelectorAll('.today-chip').forEach(function(c) {
        c.classList.toggle('active', c === chip);
      });
    }
    renderList();
  });
}

function bindFilters() {
  document.getElementById('status-pills').addEventListener('click', function(e) {
    var pill = e.target.closest('.pill');
    if (!pill) return;
    filterStatus = pill.getAttribute('data-status');
    document.querySelectorAll('#status-pills .pill').forEach(function(p) {
      p.classList.toggle('active', p === pill);
    });
    renderList();
  });
  document.getElementById('search-input').addEventListener('input', function(e) {
    searchQuery = e.target.value;
    renderList();
  });
  document.getElementById('date-filter').addEventListener('change', function(e) {
    filterDate = e.target.value;
    renderList();
  });
  document.getElementById('assignee-filter').addEventListener('change', function(e) {
    filterAssignee = e.target.value;
    renderList();
  });
}

function bindModalClose() {
  var overlay = document.getElementById('detail-modal-overlay');
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) closeDetailModal();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && overlay.classList.contains('show')) closeDetailModal();
  });
}

function parseRowDate(row) {
  return parseDateAny(getField(row, '접수일시', ['접수일', 'dateTime']));
}

function matchDateFilter(row) {
  if (filterDate === 'all') return true;
  var d = parseRowDate(row);
  if (!d) return true;
  var now = new Date();
  var start = startOfDay(now);
  if (filterDate === 'today') return d >= start;
  if (filterDate === '7d') {
    start.setDate(start.getDate() - 7);
    return d >= start;
  }
  if (filterDate === '30d') {
    start.setDate(start.getDate() - 30);
    return d >= start;
  }
  return true;
}

function matchSearch(row) {
  var q = (searchQuery || '').trim().toLowerCase();
  if (!q) return true;
  var company = String(getField(row, '업체명', ['company'])).toLowerCase();
  var phone = String(getField(row, '연락처', ['phone']));
  var phoneNorm = phone.replace(/\D/g, '');
  var qNorm = q.replace(/\D/g, '');
  var receipt = String(getField(row, '접수번호', ['receiptNo'])).toLowerCase();
  if (company.indexOf(q) !== -1) return true;
  if (receipt.indexOf(q) !== -1) return true;
  if (phone.toLowerCase().indexOf(q) !== -1) return true;
  if (qNorm.length >= 3 && phoneNorm.indexOf(qNorm) !== -1) return true;
  return false;
}

function getFilteredRows() {
  return pipelineRows.filter(function(row) {
    var status = normalizeStatus(getField(row, '상태', ['status']));
    if (filterStatus !== '전체' && status !== filterStatus) return false;
    if (!matchDateFilter(row)) return false;
    if (!matchSearch(row)) return false;
    if (!matchWorkFocus(row)) return false;
    return true;
  }).sort(compareRowPriority);
}

function updateStats() {
  var total = pipelineRows.length;
  var nNew = 0, nActive = 0, nDone = 0, nContract = 0;
  var monthStart = startOfDay(new Date());
  monthStart.setDate(1);
  var daySum = 0, dayCount = 0;
  var nToday = 0, nStale = 0, nNewStale = 0;
  var now = new Date();

  pipelineRows.forEach(function(row) {
    var s = normalizeStatus(getField(row, '상태', ['status']));
    if (s === '신규') nNew++;
    if (s === '연락시도' || s === '상담중' || s === '보류') nActive++;
    if (s === '상담완료' || s === '계약') nDone++;
    if (s === '계약') nContract++;

    var d = parseRowDate(row);
    if (d) {
      daySum += Math.max(0, Math.floor((now - d) / 86400000));
      dayCount++;
    }

    if (isActionDueToday(row)) nToday++;
    if (isStaleConsult(row)) nStale++;
    if (isNewNoContact(row)) nNewStale++;
  });

  var nMonth = pipelineRows.filter(function(row) {
    var d = parseRowDate(row);
    return d && d >= monthStart;
  }).length;

  var contractRate = total ? Math.round((nContract / total) * 100) : 0;
  var avgDays = dayCount > 0 ? Math.round(daySum / dayCount) : 0;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-new').textContent = nNew;
  document.getElementById('stat-active').textContent = nActive;
  document.getElementById('stat-done').textContent = nDone;
  document.getElementById('stat-contract').textContent = nContract;
  document.getElementById('stat-rate').textContent = contractRate + '%';
  document.getElementById('stat-month').textContent = nMonth;
  document.getElementById('stat-avgdays').textContent = avgDays;
  document.getElementById('count-today').textContent = nToday;
  document.getElementById('count-stale').textContent = nStale;
  document.getElementById('count-new-stale').textContent = nNewStale;

  var perf = calcPerformanceStats(pipelineRows);
  document.getElementById('stat-approval-amt').textContent = formatAmountKo(perf.totalApprovalAmt) + '만';
  document.getElementById('stat-execution-amt').textContent = formatAmountKo(perf.totalExecutionAmt) + '만';
  document.getElementById('stat-approval-count').textContent = perf.approvalCount;
  document.getElementById('stat-approval-rate').textContent = perf.approvalRate + '%';
  document.getElementById('stat-month-approval').textContent = perf.monthApprovalCount;
  document.getElementById('stat-month-approval-amt').textContent = formatAmountKo(perf.monthApprovalAmt) + '만';
}

function loadPipeline() {
  if (!GAS_URL) {
    showToast('GAS URL을 입력해 주세요.');
    return;
  }
  showLoading();
  fetch(GAS_URL + '?action=getPipeline', { redirect: 'follow' })
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function(text) { return JSON.parse(text); })
    .then(function(data) {
      hideLoading();
      if (data.success && Array.isArray(data.rows)) {
        pipelineRows = data.rows;
        updateStats();
        renderList();
        showToast('상담 ' + pipelineRows.length + '건 불러옴');
      } else throw new Error(data.error || '데이터 없음');
    })
    .catch(function(err) {
      hideLoading();
      console.warn(err);
      showToast('불러오기 실패: ' + err.message);
      pipelineRows = [];
      updateStats();
      renderList();
    });
}

function renderProgressBar(status, row) {
  var s = normalizeStatus(status);
  var pct = getStatusProgress(s);
  var bar = STATUS_CONFIG[s].bar;
  if (row && isApproved(row)) bar = '#16a34a';
  return '<div class="card-progress-wrap">' +
    '<div class="card-progress-track"><div class="card-progress-fill" style="width:' + pct + '%;background:' + bar + '"></div></div>' +
    '<span class="card-progress-pct">' + pct + '%</span></div>';
}

function formatTelHref(phone) {
  var digits = String(phone || '').replace(/\D/g, '');
  if (!digits) return '';
  return 'tel:' + digits;
}

function toggleCardExpand(card) {
  if (!card) return;
  card.classList.toggle('collapsed');
}

function handleQuickKakao(e) {
  if (e) e.stopPropagation();
  alert('준비중');
}

function openDetailByCardIdx(idx) {
  var filtered = getFilteredRows();
  if (filtered[idx]) openDetailModal(filtered[idx]);
}

function renderList() {
  var rows = getFilteredRows();
  var meta = document.getElementById('list-meta');
  var focusLabel = workFocus === 'today' ? ' · 오늘 예정' : (workFocus === 'stale' ? ' · 지연' : (workFocus === 'newNoContact' ? ' · 신규 미연락' : ''));
  meta.textContent = '표시 ' + rows.length + '건 / 전체 ' + pipelineRows.length + '건' + focusLabel;

  var container = document.getElementById('consult-list');
  if (rows.length === 0) {
    container.innerHTML = '<div class="empty-state"><h3>표시할 상담이 없습니다</h3><p>필터·검색 조건을 변경하거나 새로고침해 주세요.</p></div>';
    return;
  }

  container.innerHTML = rows.map(function(row, idx) {
    return renderConsultCard(row, idx);
  }).join('');

  container.querySelectorAll('.card-summary').forEach(function(summary) {
    summary.addEventListener('click', function(e) {
      if (e.target.closest('.card-quick-actions')) return;
      toggleCardExpand(summary.closest('.consult-card'));
    });
  });

  container.querySelectorAll('[data-save-card]').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var idx = parseInt(btn.getAttribute('data-idx'), 10);
      var filtered = getFilteredRows();
      if (filtered[idx]) saveCardEdits(filtered[idx], idx);
    });
  });
}

function renderConsultCard(row, idx) {
  var status = normalizeStatus(getField(row, '상태', ['status']));
  var company = getField(row, '업체명', ['company']) || '(업체명 없음)';
  var receipt = getField(row, '접수번호', ['receiptNo']);
  var name = getField(row, '신청자명', ['name', '대표자명']);
  var phone = getField(row, '연락처', ['phone']);
  var dt = getField(row, '접수일시', ['접수일', 'dateTime']);
  var region = getField(row, '지역', ['region']);
  var consultMemo = getField(row, '상담메모', ['consultMemo', '처리메모']);
  var nextAction = getField(row, '다음액션', ['nextAction']);
  var nextActionDate = toDateInputValue(getField(row, '다음액션예정일', ['nextActionDate']));
  var telHref = formatTelHref(phone);
  var stale = isStaleConsult(row);
  var hint = getStatusHint(row);

  var statusOpts = STATUS_LIST.map(function(s) {
    return '<option value="' + s + '"' + (s === status ? ' selected' : '') + '>' + s + '</option>';
  }).join('');

  var staleHtml = stale ? '<div class="card-stale-msg">3일 이상 업데이트 없음</div>' : '';
  var hintHtml = hint ? '<div class="card-status-hint">' + escapeHtml(hint) + '</div>' : '';
  var cardExtraClass = isApproved(row) ? ' is-approved' : (isApprovalDenied(row) ? ' approval-denied' : '');
  var perfSummaryHtml = renderCardPerfSummary(row);
  var approvalBadgeHtml = renderApprovalBadge(row);

  return '<article class="consult-card collapsed' + (stale ? ' is-stale' : '') + cardExtraClass + '" data-status="' + escapeHtml(status) + '" data-idx="' + idx + '">' +
    '<span class="status-badge" data-status="' + escapeHtml(status) + '">' + escapeHtml(status) + '</span>' +
    '<div class="card-summary">' +
      renderPriorityBadge(row) +
      approvalBadgeHtml +
      renderProgressBar(status, row) +
      '<div class="card-top"><div class="card-title-block">' +
        '<div class="card-company">' + escapeHtml(company) + '</div>' +
        '<div class="card-receipt">' + escapeHtml(receipt) + '</div>' +
      '</div></div>' +
      perfSummaryHtml +
      staleHtml + hintHtml +
      '<div class="card-info-grid">' +
        '<div class="card-info-item"><span class="card-info-icon">📞</span><span class="card-info-text">' + escapeHtml(phone) + '</span></div>' +
        '<div class="card-info-item"><span class="card-info-icon">📍</span><span class="card-info-text">' + escapeHtml(region || '-') + '</span></div>' +
        '<div class="card-info-item"><span class="card-info-icon">🕐</span><span class="card-info-text">' + escapeHtml(dt) + '</span></div>' +
      '</div>' +
      '<div class="card-quick-actions">' +
        (telHref ? '<a class="btn-quick" href="' + escapeHtml(telHref) + '" title="전화" onclick="event.stopPropagation()">📞</a>' : '<button type="button" class="btn-quick" disabled title="전화">📞</button>') +
        '<button type="button" class="btn-quick" title="카톡" onclick="handleQuickKakao(event)">💬</button>' +
        '<button type="button" class="btn-quick" title="상세" onclick="event.stopPropagation();openDetailByCardIdx(' + idx + ')">📋</button>' +
      '</div>' +
    '</div>' +
    '<div class="card-expand">' +
      '<div class="form-row"><label>상태</label><select data-status-select="' + idx + '" onclick="event.stopPropagation()">' + statusOpts + '</select></div>' +
      '<div class="form-row"><label>상담 메모</label><textarea data-memo="' + idx + '" onclick="event.stopPropagation()">' + escapeHtml(consultMemo) + '</textarea></div>' +
      '<div class="form-row"><label>다음 액션</label><input type="text" data-next="' + idx + '" value="' + escapeHtml(nextAction) + '" onclick="event.stopPropagation()" /></div>' +
      '<div class="form-row"><label>다음 액션 예정일</label><input type="date" data-next-date="' + idx + '" value="' + escapeHtml(nextActionDate) + '" onclick="event.stopPropagation()" /></div>' +
      '<button type="button" class="btn-save-card" data-save-card data-idx="' + idx + '">저장</button>' +
    '</div>' +
  '</article>';
}

function getCardInputs(idx) {
  var container = document.getElementById('consult-list');
  return {
    status: (container.querySelector('[data-status-select="' + idx + '"]') || {}).value || '',
    consultMemo: (container.querySelector('[data-memo="' + idx + '"]') || {}).value || '',
    nextAction: (container.querySelector('[data-next="' + idx + '"]') || {}).value || '',
    nextActionDate: (container.querySelector('[data-next-date="' + idx + '"]') || {}).value || ''
  };
}

function saveCardEdits(row, idx) {
  var inputs = getCardInputs(idx);
  inputs.consultMemo = String(inputs.consultMemo).trim();
  inputs.nextAction = String(inputs.nextAction).trim();
  saveConsultUpdate(row, inputs);
}

function saveConsultUpdate(row, fields) {
  var receiptNo = String(getField(row, '접수번호', ['receiptNo']));
  if (!receiptNo || !GAS_URL) return;

  var payload = {
    action: 'updateConsult',
    receiptNo: receiptNo,
    status: fields.status,
    consultMemo: fields.consultMemo,
    nextAction: fields.nextAction,
    processMemo: fields.consultMemo
  };
  if (fields.nextActionDate !== undefined) payload.nextActionDate = fields.nextActionDate;
  if (fields.approvalStatus !== undefined) payload.approvalStatus = fields.approvalStatus;
  if (fields.approvalAmount !== undefined) payload.approvalAmount = fields.approvalAmount;
  if (fields.executionAmount !== undefined) payload.executionAmount = fields.executionAmount;

  showLoading();
  fetch(GAS_URL, {
    method: 'POST',
    redirect: 'follow',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(payload)
  })
  .then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  })
  .then(function(text) { return JSON.parse(text); })
  .then(function(res) {
    hideLoading();
    if (res.success) {
      if (fields.status) row['상태'] = fields.status;
      if (fields.consultMemo !== undefined) {
        row['상담메모'] = fields.consultMemo;
        row['처리메모'] = fields.consultMemo;
      }
      if (fields.nextAction !== undefined) row['다음액션'] = fields.nextAction;
      if (fields.nextActionDate !== undefined) row['다음액션예정일'] = fields.nextActionDate;
      if (fields.approvalStatus !== undefined) row['승인여부'] = fields.approvalStatus;
      if (fields.approvalAmount !== undefined) row['승인금액'] = fields.approvalAmount;
      if (fields.executionAmount !== undefined) row['실행금액'] = fields.executionAmount;
      updateStats();
      renderList();
      if (detailRow && getField(detailRow, '접수번호', ['receiptNo']) === receiptNo) openDetailModal(row);
      showToast('저장되었습니다');
    } else throw new Error(res.error || '저장 실패');
  })
  .catch(function(err) {
    hideLoading();
    showToast('저장 실패: ' + err.message);
  });
}

function renderDetailSections(row) {
  var html = '';
  DETAIL_SECTIONS.forEach(function(sec) {
    html += '<div class="detail-section"><div class="detail-section-title">' + escapeHtml(sec.title) + '</div><div class="detail-grid">';
    sec.fields.forEach(function(f) {
      var val = getField(row, f.key, f.alt);
      if (val === '' && f.key !== '상태') return;
      html += '<div class="detail-item' + (f.full ? ' full' : '') + '">' +
        '<div class="detail-label">' + escapeHtml(f.key) + '</div>' +
        '<div class="detail-value">' + escapeHtml(val === '' ? '-' : val) + '</div></div>';
    });
    html += '</div></div>';
  });
  return html;
}

function openDetailModal(row) {
  detailRow = row;
  var company = getField(row, '업체명', ['company']) || '(업체명 없음)';
  var receipt = getField(row, '접수번호', ['receiptNo']);
  var status = normalizeStatus(getField(row, '상태', ['status']));

  document.getElementById('detail-modal-title').textContent = company;
  document.getElementById('detail-modal-sub').textContent = receipt;
  var banner = document.getElementById('detail-modal-status');
  banner.textContent = isApproved(row) ? status + ' · 🟢 승인완료' : status;
  banner.setAttribute('data-status', status);

  var consultMemo = getField(row, '상담메모', ['consultMemo', '처리메모']);
  var nextAction = getField(row, '다음액션', ['nextAction']);
  var nextActionDate = toDateInputValue(getField(row, '다음액션예정일', ['nextActionDate']));
  var approvalStatus = getApprovalStatus(row);
  var approvalAmount = getApprovalAmount(row);
  var executionAmount = getExecutionAmount(row);
  var statusOpts = STATUS_LIST.map(function(s) {
    return '<option value="' + s + '"' + (s === status ? ' selected' : '') + '>' + s + '</option>';
  }).join('');

  var html = renderDetailSections(row);
  html += '<div class="modal-edit"><h3>상담 처리</h3>' +
    '<div class="form-group"><label>상태 변경</label><select id="detail-status">' + statusOpts + '</select></div>' +
    '<div class="form-group"><label>상담 메모</label><textarea id="detail-memo" class="modal-textarea">' + escapeHtml(consultMemo) + '</textarea></div>' +
    '<div class="form-group"><label>다음 액션</label><textarea id="detail-next" rows="2">' + escapeHtml(nextAction) + '</textarea></div>' +
    '<div class="form-group"><label>다음 액션 예정일</label><input type="date" id="detail-next-date" value="' + escapeHtml(nextActionDate) + '" /></div>' +
    '<h3 style="margin-top:16px;margin-bottom:12px;font-size:14px;font-weight:800;color:var(--navy);">성과 관리</h3>' +
    '<div class="form-group"><label>승인여부</label><select id="detail-approval-status">' +
      '<option value="미정"' + (approvalStatus === '미정' ? ' selected' : '') + '>미정</option>' +
      '<option value="승인"' + (approvalStatus === '승인' ? ' selected' : '') + '>승인</option>' +
      '<option value="미승인"' + (approvalStatus === '미승인' ? ' selected' : '') + '>미승인</option>' +
    '</select></div>' +
    '<div class="form-group"><label>승인금액 (만원)</label><input type="number" id="detail-approval-amount" min="0" step="1" value="' + (approvalAmount ? approvalAmount : '') + '" placeholder="예: 5000" /></div>' +
    '<div class="form-group"><label>실행금액 (만원)</label><input type="number" id="detail-execution-amount" min="0" step="1" value="' + (executionAmount ? executionAmount : '') + '" placeholder="예: 3000" /></div>' +
  '</div>';

  document.getElementById('detail-modal-body').innerHTML = html;
  document.getElementById('detail-modal-overlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeDetailModal() {
  document.getElementById('detail-modal-overlay').classList.remove('show');
  document.body.style.overflow = '';
  detailRow = null;
}

function saveDetailFromModal() {
  if (!detailRow) return;
  saveConsultUpdate(detailRow, {
    status: document.getElementById('detail-status').value,
    consultMemo: document.getElementById('detail-memo').value.trim(),
    nextAction: document.getElementById('detail-next').value.trim(),
    nextActionDate: document.getElementById('detail-next-date').value,
    approvalStatus: document.getElementById('detail-approval-status').value,
    approvalAmount: document.getElementById('detail-approval-amount').value,
    executionAmount: document.getElementById('detail-execution-amount').value
  });
}
</script>
</body>
</html>
